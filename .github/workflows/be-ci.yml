# SignageWall API — quality gate for apps/be.
#
# Added 2026-08-18, the day a backend change took production down. The bug was
# an import of `multer`, a package apps/be does not depend on — it declares only
# `@types/multer`. Types are enough for the compiler, so `nest build` passed,
# `tsc` passed, and all 601 unit tests passed, because not one of them loads a
# controller. Railway then failed at `require('multer')` on boot and the API
# crash-looped.
#
# The step that catches it is "Load the compiled module graph": it runs
# `require('./dist/app.module')` from apps/be under plain Node resolution, which
# is what Railway does. That pulls in every module, controller and provider, so
# an import that cannot be resolved from THIS package — or a decorator that
# throws while the module is being loaded — fails the run.
#
# The e2e pack does NOT catch it, which was verified rather than assumed: with
# the bad import restored, e2e still passed 17/17. Jest resolves from the
# monorepo root, where `multer` exists as a transitive dependency, so the test
# environment is more forgiving than the deployed one. Keep e2e for what it
# genuinely covers (tenancy, auth, plan limits) and do not treat it as a boot
# check.
#
# The e2e run downloads a ~77 MB MongoDB binary each time (mongodb-memory-server).
# That is a few seconds and is deliberately not cached: caching it would mean a
# fourth un-pinned action, and this workflow only fires on backend changes.
name: be-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/be/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/be-ci.yml'
  pull_request:
    paths:
      - 'apps/be/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/be-ci.yml'
  workflow_call:

# Same reasoning as player-ci: a superseded commit's run is worthless, and this
# repo's Actions quota has already been exhausted once.
concurrency:
  group: be-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (compile + tests + boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@signagewall/be^...

      # Without --fix, unlike the package script: CI reports, it does not repair.
      - name: Lint
        run: pnpm --filter @signagewall/be exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0

      # apps/be has no `type-check` script — `nest build` is the compile gate.
      - name: Compile
        run: pnpm --filter @signagewall/be build

      # The check the incident at the top of this file was missing. Cheap: no
      # database, no listener — it only resolves and evaluates the module graph,
      # which is precisely where a production boot dies.
      #
      # The env block is what makes it run at all. `ConfigModule.forRoot` applies
      # the Joi schema while the module is being DEFINED, so merely requiring
      # app.module throws `Config validation error: "MONGODB_URI" is required`
      # before a single import is exercised. It passes on a developer's machine
      # only because @nestjs/config picks up apps/be/.env from the working
      # directory, and that file is gitignored — so the check failed on every run
      # from the day it was added until this one.
      #
      # Placeholders, deliberately: nothing here connects. Requiring the graph
      # evaluates module definitions, and Mongoose does not dial the URI until
      # the app is initialised, which this never does. The three named below are
      # exactly the schema's required fields (the JWT secrets carry a 32-char
      # minimum); everything else defaults.
      - name: Load the compiled module graph
        working-directory: apps/be
        run: node -e "require('./dist/app.module')"
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci-module-graph
          JWT_ACCESS_SECRET: ci-module-graph-access-secret-placeholder
          JWT_REFRESH_SECRET: ci-module-graph-refresh-secret-placeholder

      - name: Unit tests
        run: pnpm --filter @signagewall/be test

      - name: E2E (tenancy, auth, plan limits)
        run: pnpm --filter @signagewall/be test:e2e
