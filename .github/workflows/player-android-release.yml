# Edge Player — Android native shell release pipeline.
#
# Builds + signs the Android kiosk APK (a standalone Gradle project — NOT
# `tauri android`), assembles the Android update-channel manifest, and publishes
# both to the SAME public Cloudflare R2 bucket as the desktop pipeline, under a
# SEPARATE prefix `edge-player/android/`. The desktop `latest.json` is untouched:
# an APK's trust anchor is its signing certificate (PackageInstaller refuses a
# different cert) + the sha256 in this manifest, NOT minisign.
#
# Trigger:
#   - push tag `player-v<x.y.z>`  -> full build + publish
#   - workflow_dispatch (version) -> build-only smoke test (no publish)
#
# The git tag is the single source of truth; `versionName` = the tag, and
# `versionCode` is derived deterministically (major*10000 + minor*100 + patch) so
# it never regresses (Android blocks a versionCode downgrade).
#
# SECURITY: this job holds the release keystore — the fleet's update trust root.
# Pin EVERY third-party action to a commit SHA before merging (see
# player-release.yml), and keep the `fleet-signing` environment gate.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#              R2_ACCOUNT_ID, R2_RELEASES_ACCESS_KEY_ID, R2_RELEASES_SECRET_ACCESS_KEY
#   Variables: EDGE_PLAYER_URL, R2_RELEASES_BUCKET, R2_RELEASES_PUBLIC_URL,
#              KIOSK_PIN_SHA256 (optional)
name: player-android-release

on:
  push:
    tags: ['player-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0). Build-only, no publish.'
        required: true

permissions:
  contents: read

jobs:
  # Resolve version + monotonic versionCode once, shared by build + publish.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      versioncode: ${{ steps.v.outputs.versioncode }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#player-v}"
          else
            version="${{ inputs.version }}"
          fi
          IFS='.' read -r major minor patch <<< "$version"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "::error::version must be x.y.z, got '$version'"; exit 1
          fi
          code=$((major * 10000 + minor * 100 + patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "versioncode=$code" >> "$GITHUB_OUTPUT"
          echo "Resolved $version (versionCode $code)"

  build:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: fleet-signing
    defaults:
      run:
        working-directory: apps/player/android-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/edge-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/edge-release.jks" >> "$GITHUB_ENV"

      - name: Test + assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EDGE_PLAYER_URL: ${{ vars.EDGE_PLAYER_URL }}
          R2_PUBLIC: ${{ vars.R2_RELEASES_PUBLIC_URL }}
          VERSION: ${{ needs.meta.outputs.version }}
          CODE: ${{ needs.meta.outputs.versioncode }}
          PIN_SHA: ${{ vars.KIOSK_PIN_SHA256 }}
        run: |
          set -euo pipefail
          manifest="${R2_PUBLIC%/}/edge-player/android/latest.json"
          gradle :app:testDebugUnitTest :app:assembleRelease \
            -PedgePlayerUrl="$EDGE_PLAYER_URL" \
            -PupdateManifestUrl="$manifest" \
            -PversionName="$VERSION" \
            -PversionCode="$CODE" \
            ${PIN_SHA:+-PkioskPinSha256="$PIN_SHA"}

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist-android
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          test -n "$apk" || { echo "::error::no release APK produced (is the keystore configured?)"; exit 1; }
          cp "$apk" "dist-android/edge-player-${{ needs.meta.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: apps/player/android-shell/dist-android/
          if-no-files-found: error

  publish:
    needs: [meta, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: fleet-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist-android

      - name: Assemble android latest.json
        env:
          R2_PUBLIC: ${{ vars.R2_RELEASES_PUBLIC_URL }}
          VERSION: ${{ needs.meta.outputs.version }}
          CODE: ${{ needs.meta.outputs.versioncode }}
        run: |
          set -euo pipefail
          node apps/player/scripts/release/build-android-latest-json.mjs \
            --version "$VERSION" \
            --version-code "$CODE" \
            --apk "dist-android/edge-player-${VERSION}.apk" \
            --public-base "$R2_PUBLIC" \
            --out dist-android/latest.json

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the AWS SDK/CLI default CRC32 integrity headers on PutObject.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          endpoint="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Published versions are IMMUTABLE (same rationale as the desktop pipeline).
          existing=$(aws s3 ls "s3://${BUCKET}/edge-player/android/${VERSION}/" --endpoint-url "$endpoint" || true)
          if [ -n "$existing" ]; then
            echo "::error::edge-player/android/${VERSION}/ already exists on R2 — versions are immutable, bump the version"
            echo "$existing"
            exit 1
          fi

          # APK first (versioned path) so the manifest never points at a missing file.
          aws s3 cp "dist-android/edge-player-${VERSION}.apk" \
            "s3://${BUCKET}/edge-player/android/${VERSION}/edge-player-${VERSION}.apk" \
            --endpoint-url "$endpoint" \
            --content-type application/vnd.android.package-archive

          # Manifest last, at a stable key, un-cached so devices see it promptly.
          aws s3 cp dist-android/latest.json \
            "s3://${BUCKET}/edge-player/android/latest.json" \
            --endpoint-url "$endpoint" \
            --content-type application/json \
            --cache-control "no-cache"
          echo "Published edge-player android ${VERSION} to R2 bucket ${BUCKET}."
