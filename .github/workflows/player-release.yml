# Edge Player — native shell (Tauri) release pipeline.
#
# Builds + minisign-signs the kiosk installers on an OS matrix (Tauri does NOT
# cross-compile), assembles the updater `latest.json`, and publishes the
# artifacts + manifest to a public Cloudflare R2 bucket that the updater's
# `plugins.updater.endpoints` fetches over HTTPS.
#
# Trigger:
#   - push tag `player-v<x.y.z>`  -> full build + publish to R2
#   - workflow_dispatch (version) -> build-only smoke test (no publish)
#
# The git tag is the single source of truth for the version: CI stamps it into
# tauri.conf.json before building, so `latest.json.version` == the built native
# version the updater compares against.
#
# Every third-party action is pinned to a commit SHA: this workflow handles the
# OTA signing key, and a hijacked mutable tag could exfiltrate it and then sign
# malware that every device in the fleet would happily install.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Secrets:   TAURI_SIGNING_PRIVATE_KEY, R2_ACCOUNT_ID,
#              R2_RELEASES_ACCESS_KEY_ID, R2_RELEASES_SECRET_ACCESS_KEY
#   Variables: EDGE_PLAYER_URL, R2_RELEASES_BUCKET, R2_RELEASES_PUBLIC_URL
name: player-release

on:
  push:
    tags: ['player-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0). Build-only, no publish.'
        required: true

permissions:
  contents: read

jobs:
  # A release must never ship code that doesn't lint, compile, or pass its tests
  # — including the Windows-only rollback path (see player-ci.yml).
  check:
    uses: ./.github/workflows/player-ci.yml

  # Resolve the version once (from the tag or the dispatch input) so every
  # matrix job and the publish job stamp the exact same value.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#player-v}"
          else
            version="${{ inputs.version }}"
          fi
          if [ -z "$version" ]; then
            echo "::error::could not resolve a version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  build:
    needs: [meta, check]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--bundles` is set explicitly per-platform because the committed
          # bundle.targets (["nsis"]) is Windows-only; mac needs the `app`
          # bundle to emit the updater `.app.tar.gz`.
          #
          # `optional` marks the dev/test platforms: the fleet is Windows, and a
          # transient macOS-runner hiccup must not block shipping a critical
          # Windows shell update.
          - platform: windows-latest
            key: windows-x86_64
            optional: false
            args: '--bundles nsis'
            rust_target: ''
            bundle_glob: apps/player/src-tauri/target/release/bundle/nsis/*-setup.exe
          - platform: macos-latest
            key: darwin-aarch64
            optional: true
            args: '--target aarch64-apple-darwin --bundles app'
            rust_target: aarch64-apple-darwin
            bundle_glob: apps/player/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: macos-latest
            key: darwin-x86_64
            optional: true
            args: '--target x86_64-apple-darwin --bundles app'
            rust_target: x86_64-apple-darwin
            bundle_glob: apps/player/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.optional }}
    name: build (${{ matrix.key }})
    # This job holds the fleet OTA signing key. Gate it behind a protected GitHub
    # Environment so a workflow_dispatch on an arbitrary branch can't run the
    # signing step (and exfiltrate the key) without a reviewer. NOTE: this line is
    # inert until the `fleet-signing` Environment is created in repo Settings with
    # required reviewers / branch restrictions — do that as part of hardening
    # (see the release README); referencing it here is only the hook.
    environment: fleet-signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Version comes from the root package.json `packageManager: pnpm@11.8.0`
      # field — passing `version` here too errors with "Multiple versions".
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/player/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tauri build`'s beforeBuildCommand only builds the player itself, not its
      # workspace deps (@edge/apps writes into apps/player/public/apps/**, and
      # the TS contracts must exist). Build the dependency graph first.
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@edge/player^...

      # Stamp the release-specific, non-committed values, then FAIL CLOSED if any
      # dev placeholder survived. A silently-unsubstituted origin would ship a
      # capability that denies the remote page every Tauri command, fleet-wide.
      - name: Stamp version, endpoint & prod origin
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          EDGE_PLAYER_URL: ${{ vars.EDGE_PLAYER_URL }}
          R2_PUBLIC: ${{ vars.R2_RELEASES_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${EDGE_PLAYER_URL:-}" ]; then
            echo "::error::EDGE_PLAYER_URL variable is not set — the shell would bake localhost."
            exit 1
          fi
          if [ -z "${R2_PUBLIC:-}" ]; then
            echo "::error::R2_RELEASES_PUBLIC_URL variable is not set — no updater endpoint."
            exit 1
          fi
          conf=apps/player/src-tauri/tauri.conf.json
          caps=apps/player/src-tauri/capabilities/default.json
          endpoint="${R2_PUBLIC%/}/edge-player/latest.json"
          origin=$(node -e 'process.stdout.write(new URL(process.env.EDGE_PLAYER_URL).origin)')

          jq --arg v "$VERSION" --arg ep "$endpoint" \
            '.version = $v | .plugins.updater.endpoints = [$ep]' "$conf" > "$conf.tmp"
          mv "$conf.tmp" "$conf"

          # Replace remote.urls WHOLESALE: mapping only the placeholder would
          # leave the dev http://localhost:5174 entry granting native commands
          # (identity, updater, process) to any page served from localhost.
          jq --arg o "$origin" '.remote.urls = [$o]' "$caps" > "$caps.tmp"
          mv "$caps.tmp" "$caps"

          # --- fail closed ---
          if grep -q 'REPLACE_' "$conf" "$caps"; then
            echo "::error::an unsubstituted REPLACE_ placeholder survived into the release build"
            exit 1
          fi
          if ! jq -e '.plugins.updater.endpoints | length == 1 and all(.[]; startswith("https://"))' "$conf" >/dev/null; then
            echo "::error::updater endpoint must be exactly one https:// URL"
            exit 1
          fi
          if ! jq -e --arg o "$origin" '.remote.urls == [$o]' "$caps" >/dev/null; then
            echo "::error::capability remote.urls is not pinned to the prod origin"
            exit 1
          fi
          echo "version=$VERSION  endpoint=$endpoint  origin=$origin"

      - name: Build & sign the shell
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          # option_env! bakes this at Rust compile time; the shell loads this
          # remote player URL at runtime.
          EDGE_PLAYER_URL: ${{ vars.EDGE_PLAYER_URL }}
          # Minisign signing key — must be real process env (.env files do not
          # work). The key has no passphrase, so no PASSWORD secret exists: an
          # absent secret expands to "", which Tauri reads as "no password".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/player
          # No tagName/releaseId -> build only, do NOT touch GitHub Releases.
          args: ${{ matrix.args }}

      # Collect the updater artifact (+ its .sig) into a flat folder, renaming
      # away spaces so the latest.json URLs never need %20 encoding. A missing
      # signature is a HARD failure: an unsigned artifact can never be installed
      # by the updater, so shipping one would just brick the release.
      - name: Stage artifacts
        shell: bash
        env:
          BUNDLE_GLOB: ${{ matrix.bundle_glob }}
        run: |
          set -euo pipefail
          mkdir -p staging
          found=0
          while IFS= read -r -d '' f; do
            base="$(basename "$f" | tr ' ' '-')"
            cp "$f" "staging/$base"
            if [ ! -f "$f.sig" ]; then
              echo "::error::no signature next to $f — is TAURI_SIGNING_PRIVATE_KEY set?"
              exit 1
            fi
            cp "$f.sig" "staging/$base.sig"
            found=$((found + 1))
          done < <(find "$(dirname "$BUNDLE_GLOB")" -maxdepth 1 -name "$(basename "$BUNDLE_GLOB")" -print0)
          if [ "$found" -ne 1 ]; then
            echo "::error::expected exactly 1 updater artifact matching $BUNDLE_GLOB, found $found"
            exit 1
          fi
          ls -la staging

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.key }}
          path: staging/
          if-no-files-found: error

  publish:
    needs: [meta, build]
    # Only real tag releases publish; workflow_dispatch stays a build-only test.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Same gate as the build job: this job signs the manifest with the OTA key, so
    # it must only run for allowed release refs and (if configured) with approval.
    environment: fleet-signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # The @tauri-apps/cli (for `tauri signer sign`) — no Rust build needed, the
      # signer is pure JS. Installs the workspace so `pnpm exec tauri` resolves.
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-release
          pattern: release-*

      # `--require` fails closed: the fleet is Windows, so a manifest without a
      # windows-x86_64 entry must never be published (the mac legs are optional).
      - name: Assemble latest.json
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          R2_PUBLIC: ${{ vars.R2_RELEASES_PUBLIC_URL }}
        run: |
          set -euo pipefail
          node apps/player/scripts/release/build-latest-json.mjs \
            --version "$VERSION" \
            --artifacts dist-release \
            --public-base "$R2_PUBLIC" \
            --require windows-x86_64 \
            --out dist-release/latest.json
          echo "--- latest.json ---"
          cat dist-release/latest.json

      # Sign the MANIFEST itself (not just the installer bytes, which the artifacts
      # already carry). The shell verifies this detached signature before trusting
      # the manifest's (version, url) — so an attacker with R2 write / a MITM can't
      # point a high-version manifest at an old, signed, vulnerable installer
      # (signed-downgrade). Same minisign key as the installers.
      - name: Sign the manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          pnpm --filter @edge/player exec tauri signer sign dist-release/latest.json
          test -f dist-release/latest.json.sig \
            || { echo "::error::no latest.json.sig produced — is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; }
          echo "--- latest.json.sig ---"
          cat dist-release/latest.json.sig

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the AWS SDK/CLI default CRC32 integrity headers on PutObject.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          endpoint="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Published versions are IMMUTABLE. Overwriting edge-player/<version>/
          # would hand devices that already took that version different bytes
          # under the same version number — and they'd never re-pull, leaving the
          # fleet split-brained on one version string.
          existing=$(aws s3 ls "s3://${BUCKET}/edge-player/${VERSION}/" --endpoint-url "$endpoint" || true)
          if [ -n "$existing" ]; then
            echo "::error::edge-player/${VERSION}/ already exists on R2 — versions are immutable, bump the version"
            echo "$existing"
            exit 1
          fi

          # Installers first (versioned path) so the manifest never points at a
          # not-yet-uploaded file. The .sig files are NOT uploaded — their
          # contents are already inlined into latest.json.
          for d in dist-release/release-*; do
            for f in "$d"/*; do
              case "$f" in
                *.sig) continue ;;
              esac
              name="$(basename "$f")"
              aws s3 cp "$f" "s3://${BUCKET}/edge-player/${VERSION}/${name}" \
                --endpoint-url "$endpoint"
            done
          done

          # Manifest signature next to the manifest — the shell fetches
          # `latest.json.sig` and verifies it before trusting the manifest.
          # Upload it BEFORE the manifest so a device can never fetch a new
          # manifest whose signature isn't up yet.
          aws s3 cp dist-release/latest.json.sig "s3://${BUCKET}/edge-player/latest.json.sig" \
            --endpoint-url "$endpoint" \
            --content-type text/plain \
            --cache-control "no-cache"

          # Manifest last, at a stable key, un-cached so devices see it promptly.
          aws s3 cp dist-release/latest.json "s3://${BUCKET}/edge-player/latest.json" \
            --endpoint-url "$endpoint" \
            --content-type application/json \
            --cache-control "no-cache"
          echo "Published edge-player ${VERSION} to R2 bucket ${BUCKET}."
