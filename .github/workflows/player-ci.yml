# SignageWall Player — quality gate for the web player and the Android shell.
#
# Runs on every push/PR that touches the player, and is CALLED by
# player-release.yml and player-android-release.yml so a release can never ship
# code that doesn't lint, compile, or pass its tests.
#
# PAUSED 2026-08-05 — the `rust` lane (Tauri shell: cargo fmt/clippy/test) is
# removed while the desktop player is on hold. It ran a windows + macos matrix,
# and GitHub bills those at 2x and 10x Linux minutes: a single run cost ~180
# billed minutes against this private repo's 2,000/month free quota, and it fired
# on every PR AND on every Android release (both release workflows gate on this
# file). That alone exhausted the quota and blocked all Actions.
#
# What is no longer covered: nothing here compiles apps/player/src-tauri, so the
# updater's `#[cfg(windows)]` rollback path is unverified by CI — exactly the
# "green locally, broken on the device" gap the matrix existed to close. Restore
# the job from git history BEFORE the next desktop release; a self-hosted runner
# is the free way to keep it.
name: player-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/player/**'
      - 'packages/**'
      - '.github/workflows/player-*.yml'
  pull_request:
    paths:
      - 'apps/player/**'
      - 'packages/**'
      - '.github/workflows/player-*.yml'
  workflow_call:

# A superseded commit's CI is worthless — cancel it instead of paying for it to
# finish. Pushing three times in a row used to run three full matrices to
# completion, on a quota that cannot afford one.
#
# The group is prefixed with this file's own name on purpose. Inside a reusable
# workflow the `github` context belongs to the CALLER, so `github.workflow` here
# expands to `player-release` / `player-android-release` when those gate on this
# file — without the literal prefix this job would land in the SAME group as the
# caller that is waiting on it, and cancel (or, with cancel-in-progress: false,
# deadlock against) its own parent.
concurrency:
  group: player-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@signagewall/player^...
      - name: Typecheck
        run: pnpm --filter @signagewall/player exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter @signagewall/player test
      - name: Lint
        run: pnpm --filter @signagewall/player lint

  android:
    name: android (compile + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # TODO: pin the Android toolchain actions to commit SHAs to match repo convention.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # assembleDebug compiles the whole shell (the debug build type auto-signs, so
      # no keystore secret is needed); testDebugUnitTest runs the JVM-side tests
      # (DeviceIdStore, BridgeDispatcher, UpdateDecisions).
      - name: Compile + unit tests
        working-directory: apps/player/android-shell
        run: gradle :app:assembleDebug :app:testDebugUnitTest
