# SignageWall Player — quality gate for the web player and the native (Tauri) shell.
#
# Runs on every push/PR that touches the player, and is CALLED by
# player-release.yml so a release can never ship code that doesn't lint, compile,
# or pass its tests.
#
# The Rust lane runs on BOTH windows and macos on purpose: the updater's rollback
# path is `#[cfg(windows)]`, so a macOS-only lane would never even compile it —
# exactly the "green locally, broken on the device" gap this fleet cannot afford.
name: player-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/player/**'
      - 'packages/**'
      - '.github/workflows/player-*.yml'
  pull_request:
    paths:
      - 'apps/player/**'
      - 'packages/**'
      - '.github/workflows/player-*.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@signagewall/player^...
      - name: Typecheck
        run: pnpm --filter @signagewall/player exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter @signagewall/player test
      - name: Lint
        run: pnpm --filter @signagewall/player lint

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/player/src-tauri

      - run: pnpm install --frozen-lockfile
      # `generate_context!` embeds `frontendDist` at compile time, so the web
      # bundle must exist before cargo can even parse the crate.
      - name: Build the frontend (required to compile the shell)
        run: |
          pnpm turbo run build --filter=@signagewall/player^...
          pnpm --filter @signagewall/player build

      # `externalBin` makes tauri-build fail EVERY cargo build until the sidecar is
      # staged (it validates existence in build.rs) — build + stage it for the host
      # triple before fmt/clippy/test. The script placeholder-bootstraps around the
      # same-package chicken-and-egg.
      - name: Stage the watchdog sidecar
        working-directory: apps/player/src-tauri
        run: node scripts/prepare-watchdog.mjs

      - name: Format
        working-directory: apps/player/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: apps/player/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: apps/player/src-tauri
        run: cargo test

  android:
    name: android (compile + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # TODO: pin the Android toolchain actions to commit SHAs to match repo convention.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # assembleDebug compiles the whole shell (the debug build type auto-signs, so
      # no keystore secret is needed); testDebugUnitTest runs the JVM-side tests
      # (DeviceIdStore, BridgeDispatcher, UpdateDecisions).
      - name: Compile + unit tests
        working-directory: apps/player/android-shell
        run: gradle :app:assembleDebug :app:testDebugUnitTest
