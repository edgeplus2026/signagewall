# Local development infrastructure.
# Redis backs the BullMQ queue used by the AI content generator.
#   docker compose up -d redis
services:
  redis:
    image: redis:7-alpine
    container_name: signagewall-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
