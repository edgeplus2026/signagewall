[package]
name = "signagewall-player"
version = "0.1.0"
description = "SignageWall Player native shell"
authors = ["SignageWall"]
edition = "2021"
rust-version = "1.77.2"
# This crate ships two bins: the player shell (src/main.rs) and the watchdog
# sidecar (src/bin/signagewall-watchdog.rs). Tauri's dev/build run a bare `cargo run`/
# `cargo build`, which is ambiguous with >1 bin — name the default explicitly or
# `tauri dev`/`tauri build` fail with "could not determine which binary to run".
default-run = "signagewall-player"

# The Tauri v2 convention: a thin bin that calls into a lib crate (keeps the door
# open for the mobile targets later, which require the lib layout).
[lib]
name = "signagewall_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Integrity hash for the cached rollback installer: it lives in a user-writable
# dir with no OS code signature, so the watchdog re-hashes it before executing it
# on rollback (the plugin only verifies the download, never this cached exec).
sha2 = "0.10"
# `time` only — bounds the update check/download so a stalled transfer on a
# flaky signage link can't wedge the update path forever.
tokio = { version = "1", features = ["time"] }
# OS config-dir resolution shared by the shell and the standalone watchdog. The
# watchdog has no Tauri runtime, so it resolves `app_config_dir()` itself as
# `dirs::config_dir()/<identifier>` — the exact formula Tauri v2 uses. Already in
# the lock (a transitive dep); promoted to a direct dep here.
dirs = "6"

# OTA updater (Phase 2). Desktop-only: the updater ships as installer artifacts
# per OS; mobile (Android, later) updates through its own store channel, so the
# crate is gated to the desktop targets to keep an eventual mobile build clean.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
# Manifest authentication: the plugin verifies only the installer bytes, so we
# fetch `latest.json` + its detached minisign signature and verify the manifest
# ourselves (closes the signed-downgrade gap). rustls to match the tree (no
# OpenSSL on Windows); these all already resolve transitively via the updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
minisign-verify = "0.2"
base64 = "0.22"

# Later phases (added in their phases, not now):
#   (health/watchdog + CEC are plain std/OS calls, no extra crates required)

[profile.release]
# Smaller, kiosk-appropriate release binaries.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
